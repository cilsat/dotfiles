
[env]
TERM = "xterm-256color"

[window]
padding = { x = 0, y = 0 }
dynamic_padding = true
decorations = "Buttonless"
startup_mode = "Maximized"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Light" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Light Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 11.5
offset = { x = 0, y = -1}

# TokyoNight Alacritty Colors
# Default colors
[colors.primary]
background = "#222436"
foreground = "#c8d3f5"

#[colors.cursor]
#cursor = "#c8d3f5"
#text = "#222436"

# Normal colors
[colors.normal]
black = "#1b1d2b"
red = "#ff757f"
green = "#c3e88d"
yellow = "#ffc777"
blue = "#82aaff"
magenta = "#c099ff"
cyan = "#86e1fc"
white = "#828bb8"

# Bright colors
[colors.bright]
black = "#444a73"
red = "#ff757f"
green = "#c3e88d"
yellow = "#ffc777"
blue = "#82aaff"
magenta = "#c099ff"
cyan = "#86e1fc"
white = "#c8d3f5"

# Indexed Colors
[[colors.indexed_colors]]
index = 16
color = "#ff966c"

[[colors.indexed_colors]]
index = 17
color = "#c53b53"

[[colors.indexed_colors]]
index = 18
color = "#16161e"

[[colors.indexed_colors]]
index = 19
color = "#292e42"

[keyboard]
bindings = [
  { key = "Key1", mods = "Command", chars = "\u001b1" },
  { key = "Key2", mods = "Command", chars = "\u001b2" },
  { key = "Key3", mods = "Command", chars = "\u001b3" },
  { key = "Key4", mods = "Command", chars = "\u001b4" },
  { key = "Key5", mods = "Command", chars = "\u001b5" },
  { key = "Key6", mods = "Command", chars = "\u001b6" },
  { key = "Key7", mods = "Command", chars = "\u001b7" },
  { key = "Key8", mods = "Command", chars = "\u001b8" },
  { key = "Key9", mods = "Command", chars = "\u001b9" },
  { key = "n", mods = "Command", chars = "\u001bn" },
  { key = "p", mods = "Command", chars = "\u001bp" },
  { key = "a", mods = "Command", chars = "\u001ba" },
  { key = "z", mods = "Command", chars = "\u001bz" },
  { key = "Enter", mods = "Command", action = "CreateNewWindow" }
]

[general]
live_config_reload = true
